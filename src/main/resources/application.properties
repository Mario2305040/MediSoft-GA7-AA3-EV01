spring.application.name=medisoft-aa3-web
server.port=${PORT:8080}
spring.datasource.url=${MEDISOFT_AA3_DB_URL:jdbc:mysql://localhost:3306/medisoft_aa3?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${MEDISOFT_AA3_DB_USER:medisoft_aa3_app}
spring.datasource.password=${MEDISOFT_AA3_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.thymeleaf.cache=false
